name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore EasyDoc.sln

      - name: Build
        run: dotnet build EasyDoc.sln --no-restore

      - name: Test
        run: dotnet test EasyDoc.UnitTests/EasyDoc.UnitTests.csproj --no-build --nologo
